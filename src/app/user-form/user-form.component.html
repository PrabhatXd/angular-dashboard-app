<div class="layout">


  <aside class="side-nav">
    <app-side-nav></app-side-nav>
  </aside>

  <main class="content">

    <h2 class="page-title">Users Data</h2>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>User ID</th>
            <th>Title</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let user of userdata">
            <td>{{ user.id }}</td>
            <td>{{ user.userId }}</td>
            <td class="title">{{ user.title }}</td>
            <td>
              <span
                class="status"
                [class.completed]="user.completed"
                [class.pending]="!user.completed">
                {{ user.completed ? 'Completed' : 'Pending' }}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

</div>
